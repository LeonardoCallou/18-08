<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troco verificado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Troco verificado</h1>

    <p>Troco verificado</p>

    <div>
        <label for="preco">Preço do produto:</label>
        <input type="number" id="preco" placeholder="Digite aqui o preço">
    </div>

    <div>
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" placeholder="Digite aqui a quantidade">
    </div>

    <div>
        <label for="valor">Valor recebido:</label>
        <input type="number" id="valor" placeholder="Valor recebido">
    </div>

    <button>Calcular</button>


    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
